name: infinity

# Shared API/worker image. Runtime settings live in the root `.env`.
x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: infinity-backend
  environment: &backend-env
    NODE_ENV: ${NODE_ENV:-production}
    PORT: 5000
    # Replica set is required for multi-document transactions.
    MONGO_URI: ${MONGO_URI:?MONGO_URI is required in the root .env}
    REDIS_URL: redis://redis:6379
    CLIENT_URL: ${CLIENT_URL:-http://localhost}
    CORS_ORIGINS: ${CORS_ORIGINS:-}
    JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    REPORT_HMAC_SECRET: ${REPORT_HMAC_SECRET:?REPORT_HMAC_SECRET is required}
    ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
    REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-7}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    PUBLIC_VERIFY_BASE_URL: ${PUBLIC_VERIFY_BASE_URL:-}
    INSTITUTION_NAME: ${INSTITUTION_NAME:-Secure Exam Platform}
    GRACE_SECONDS: ${GRACE_SECONDS:-5}
    MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
    UPLOAD_DIR: /app/data/uploads
    LOG_LEVEL: ${LOG_LEVEL:-info}
    ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED:-false}
    DISPUTE_SLA_HOURS: ${DISPUTE_SLA_HOURS:-72}
    DISPUTE_COUNTERSIGN_MARKS: ${DISPUTE_COUNTERSIGN_MARKS:-2}
    RATE_LIMIT_IP_PER_MIN: ${RATE_LIMIT_IP_PER_MIN:-3000}
    RATE_LIMIT_USER_PER_MIN: ${RATE_LIMIT_USER_PER_MIN:-300}
    RATE_LIMIT_AUTOSAVE_PER_MIN: ${RATE_LIMIT_AUTOSAVE_PER_MIN:-120}
    METRICS_TOKEN: ${METRICS_TOKEN:-}
    # Optional — only set these in `.env` if you want outbound email.
    EMAIL_FROM: ${EMAIL_FROM:-}
    BREVO_API_KEY: ${BREVO_API_KEY:-}
  restart: unless-stopped
  networks:
    - app
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -ec
      - |
        if [ ! -s /data/keyfile/replica.key ]; then
          umask 077
          head -c 756 /dev/urandom | base64 > /data/keyfile/replica.key
        fi
        chown mongodb:mongodb /data/keyfile/replica.key
        chmod 400 /data/keyfile/replica.key
        exec /usr/local/bin/docker-entrypoint.sh "$$@"
      - --
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/data/keyfile/replica.key"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-exam}
      MONGO_APP_USER: ${MONGO_APP_USER:?MONGO_APP_USER is required}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}
    volumes:
      - mongo_data:/data/db
      - mongo_key:/data/keyfile
      - ./backend/docker/mongo-init-app-user.sh:/docker-entrypoint-initdb.d/01-create-app-user.sh:ro
    healthcheck:
      # Bootstrap rs0 on first boot (auth required once the root user exists).
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"try { quit(rs.status().ok ? 0 : 1) } catch (e) { quit(rs.initiate({_id:'rs0', members:[{_id:0, host:'mongodb:27017'}]}).ok ? 0 : 1) }\"",
        ]
      interval: 10s
      timeout: 15s
      retries: 15
      start_period: 40s
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 5s
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    <<: *backend
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/data/uploads
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:5000/api/v1/health/ready'); if(!r.ok) process.exit(1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  worker:
    <<: *backend
    command: ["bun", "src/workers/jobs.worker.ts"]
    healthcheck:
      disable: true
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - worker_logs:/app/logs
      - backend_uploads:/app/data/uploads

  # Optional demo data: docker compose --profile seed run --rm seed
  seed:
    <<: *backend
    profiles: ["seed"]
    command: ["bun", "src/scripts/seed.ts"]
    environment:
      <<: *backend-env
      ALLOW_DEMO_SEED: "true"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx.Dockerfile
    image: verity-nginx
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST:?SITE_HOST is required}
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL is required}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --max-time 5 --resolve \"$$SITE_HOST:443:127.0.0.1\" \"https://$$SITE_HOST/api/v1/health/ready\" >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - tls_data:/etc/letsencrypt
      - tls_work:/var/lib/letsencrypt
      - tls_logs:/var/log/letsencrypt
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app:
    driver: bridge

volumes:
  mongo_data:
  mongo_key:
  redis_data:
  backend_logs:
  worker_logs:
  backend_uploads:
  tls_data:
  tls_work:
  tls_logs:
