name: infinity

# Shared API/worker image. Secrets and knobs come from the root `.env`
# (see `.env.example`). MONGO_URI / REDIS_URL are injected for the compose network.
x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: infinity-backend
  env_file:
    - path: .env
      required: false
  environment:
    NODE_ENV: ${NODE_ENV:-production}
    PORT: 5000
    # Replica set is required for multi-document transactions.
    MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin&replicaSet=rs0&directConnection=true
    REDIS_URL: redis://redis:6379
    CLIENT_URL: ${CLIENT_URL:-http://localhost}
    CORS_ORIGINS: ${CORS_ORIGINS:-}
    JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    REPORT_HMAC_SECRET: ${REPORT_HMAC_SECRET:?REPORT_HMAC_SECRET is required}
    ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
    REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-7}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    PUBLIC_VERIFY_BASE_URL: ${PUBLIC_VERIFY_BASE_URL:-}
    INSTITUTION_NAME: ${INSTITUTION_NAME:-Secure Exam Platform}
    GRACE_SECONDS: ${GRACE_SECONDS:-5}
    MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
    UPLOAD_DIR: /app/data/uploads
    LOG_LEVEL: ${LOG_LEVEL:-info}
    ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED:-false}
    DISPUTE_SLA_HOURS: ${DISPUTE_SLA_HOURS:-72}
    DISPUTE_COUNTERSIGN_MARKS: ${DISPUTE_COUNTERSIGN_MARKS:-2}
    RATE_LIMIT_IP_PER_MIN: ${RATE_LIMIT_IP_PER_MIN:-3000}
    RATE_LIMIT_USER_PER_MIN: ${RATE_LIMIT_USER_PER_MIN:-300}
    RATE_LIMIT_AUTOSAVE_PER_MIN: ${RATE_LIMIT_AUTOSAVE_PER_MIN:-120}
    METRICS_TOKEN: ${METRICS_TOKEN:-}
    # Optional — only set these in `.env` if you want outbound email.
    EMAIL_FROM: ${EMAIL_FROM:-}
    BREVO_API_KEY: ${BREVO_API_KEY:-}
  restart: unless-stopped
  networks:
    - app
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?MONGO_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-exam}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Bootstrap rs0 on first boot (auth required once the root user exists).
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"try { quit(rs.status().ok ? 0 : 1) } catch (e) { quit(rs.initiate({_id:'rs0', members:[{_id:0, host:'mongodb:27017'}]}).ok ? 0 : 1) }\"",
        ]
      interval: 10s
      timeout: 15s
      retries: 15
      start_period: 40s
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 5s
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    <<: *backend
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/data/uploads
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:5000/api/v1/health/ready'); if(!r.ok) process.exit(1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  worker:
    <<: *backend
    command: ["bun", "src/workers/jobs.worker.ts"]
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - worker_logs:/app/logs
      - backend_uploads:/app/data/uploads

  # Optional demo data: docker compose --profile seed run --rm seed
  seed:
    <<: *backend
    profiles: ["seed"]
    command: ["bun", "src/scripts/seed.ts"]
    environment:
      ALLOW_DEMO_SEED: "true"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    image: infinity-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  backend_logs:
  worker_logs:
  backend_uploads:
