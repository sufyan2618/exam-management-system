name: infinity

x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: infinity-backend
  env_file:
    - .env
  environment:
    NODE_ENV: ${NODE_ENV:-production}
    PORT: 5000
    # Replica set is required for multi-document transactions.
    MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin&replicaSet=rs0&directConnection=true
    REDIS_URL: redis://redis:6379
    CLIENT_URL: ${CLIENT_URL}
    JWT_SECRET: ${JWT_SECRET}
    ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
    REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-7}
    EMAIL_FROM: ${EMAIL_FROM:-}
    BREVO_API_KEY: ${BREVO_API_KEY:-}
    REPORT_HMAC_SECRET: ${REPORT_HMAC_SECRET:-}
    INSTITUTION_NAME: ${INSTITUTION_NAME:-Secure Exam Platform}
    GRACE_SECONDS: ${GRACE_SECONDS:-5}
    ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED:-false}
  restart: unless-stopped
  networks:
    - app
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-rs-init.js:/docker-entrypoint-initdb.d/01-rs.js:ro
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--username",
          "${MONGO_USER}",
          "--password",
          "${MONGO_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongodb:27017'}]}).ok }",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 5s
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    <<: *backend
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/data/uploads
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:5000/api/v1/health/live'); if(!r.ok) process.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s

  worker:
    <<: *backend
    command: ["bun", "src/workers/jobs.worker.ts"]
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - worker_logs:/app/logs
      - backend_uploads:/app/data/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    image: infinity-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  backend_logs:
  worker_logs:
  backend_uploads:
