worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    # Imports allow up to MAX_UPLOAD_MB (default 5); leave headroom for multipart.
    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    upstream backend {
        server backend:5000;
    }

    server {
        listen 80;
        server_name __SITE_HOST__;
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }
        location / { return 308 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name __SITE_HOST__;
        ssl_certificate /etc/letsencrypt/live/__SITE_HOST__/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/__SITE_HOST__/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        root /usr/share/nginx/html;
        index index.html;

        location = /config.json {
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-store" always;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Long-lived SSE streams (attempt + monitor).
        location ~ ^/api/v1/(attempts/[^/]+/stream|exams/[^/]+/monitor/stream)$ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
